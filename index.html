    <script>
      (function() {
        try {
          var saved = localStorage.getItem('appgenerica_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        try {
          if ('caches' in window) {
            caches.delete('chinmi-app-v1').catch(function() {});
          }
          window.addEventListener('error', function(ev) {
            var target = ev && ev.target;
            if (!target) return;
            var tag = target.tagName;
            var url = target.src || target.href || '';
            if ((tag === 'SCRIPT' || tag === 'LINK') && url.indexOf('/assets/') !== -1) {
              var reloaded = sessionStorage.getItem('chinmi_asset_reload_once');
              if (!reloaded) {
                sessionStorage.setItem('chinmi_asset_reload_once', '1');
                var p = Promise.resolve();
                if ('serviceWorker' in navigator) {
                  p = navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  }).catch(function() {});
                }
                p.then(function() {
                  if ('caches' in window) {
                    return caches.keys().then(function(keys) {
                      return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                    }).catch(function() {});
                  }
                }).finally(function() {
                  window.location.reload();
                });
              }
            }
          }, true);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full w-full overflow-x-hidden font-sans antialiased bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root" class="h-full w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
